name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button for manual deploys

permissions:
  id-token: write # needed for OIDC login to AWS (no stored keys)
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ap-south-1
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BOOKING_API_URL: ${{ vars.NEXT_PUBLIC_BOOKING_API_URL }}
          NEXT_PUBLIC_GOOGLE_BOOKING_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_BOOKING_URL }}


      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed JS/CSS never change: cache for a year.
      - name: Upload static assets
        run: |
          aws s3 sync out/_next "s3://$S3_BUCKET/_next" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      # Everything else (HTML, images, txt): always revalidate.
      - name: Upload pages and images
        run: |
          aws s3 sync out "s3://$S3_BUCKET" \
            --delete \
            --exclude "_next/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Clear CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths "/*"